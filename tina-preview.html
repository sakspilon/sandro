<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Preview – Sandro</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --black: #080c14;
    --white: #f0f4ff;
    --accent: #F59E0B;
    --muted: #8892a4;
    --card-bg: #0f1520;
    --border: rgba(255,255,255,0.07);
  }
  body {
    background: var(--black);
    color: var(--white);
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 1000;
    opacity: 0.4;
  }

  nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 32px 6vw;
    opacity: 0;
    animation: fadeUp 0.8s ease 0.1s forwards;
  }

  .nav-logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    letter-spacing: 3px;
    color: var(--accent);
  }

  .hero {
    padding: 40px 6vw 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 32px;
  }

  .hero-photo-wrap {
    position: relative;
    opacity: 0;
    animation: fadeUp 0.9s ease 0.2s forwards;
  }

  .hero-photo {
    width: 200px;
    height: 200px;
    border-radius: 50%;
    object-fit: cover;
    object-position: top center;
    display: block;
    border: 3px solid #B45309;
  }

  .hero-photo-tag {
    position: absolute;
    bottom: 28px;
    left: 28px;
    background: linear-gradient(270deg, #B45309, #1a1208, #B45309);
    background-size: 400% 400%;
    animation: shimmer 28s ease infinite;
    color: var(--white);
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    padding: 8px 14px;
    font-weight: 500;
  }

  .hero-content {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    opacity: 0;
    animation: fadeUp 0.8s ease 0.4s forwards;
  }

  .hero-label {
    font-size: 11px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--accent);
  }

  .hero-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(40px, 5vw, 72px);
    line-height: 0.95;
  }

  .hero-title em {
    font-style: normal;
    background: linear-gradient(270deg, #F59E0B, #B45309, #FBBF24, #B45309);
    background-size: 400% 400%;
    animation: shimmer 28s ease infinite;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    display: block;
    font-weight: 900;
  }

  .hero-sub {
    font-size: 14px;
    color: var(--muted);
    line-height: 1.8;
    max-width: 380px;
  }

  /* VIDEOS */
  .videos-section {
    padding: 0 6vw 40px;
  }

  .videos-label {
    font-size: 11px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 28px;
  }

  .video-links {
    display: flex;
    flex-direction: column;
    gap: 2px;
    max-width: 560px;
  }

  .video-link {
    display: flex;
    align-items: center;
    gap: 28px;
    padding: 28px 32px;
    background: linear-gradient(135deg, #B45309, #0f1520, #B45309, #080c14);
    background-size: 400% 400%;
    animation: shimmer 30s ease infinite;
    text-decoration: none;
    color: var(--white);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }

  .video-link:hover {
    transform: translateX(8px);
    box-shadow: -4px 0 0 var(--accent);
  }

  .vl-num {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 32px;
    color: var(--accent);
    line-height: 1;
    flex-shrink: 0;
  }

  .vl-label {
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: uppercase;
    opacity: 0.8;
  }

  /* CTA */
  .cta-section {
    padding: 0 6vw 80px;
  }

  .cta-divider {
    width: 40px;
    height: 2px;
    background: var(--accent);
    margin-bottom: 32px;
    opacity: 0.4;
  }

  .cta-text {
    font-size: 14px;
    color: var(--muted);
    margin-bottom: 24px;
    max-width: 400px;
    line-height: 1.7;
  }

  .cta-link {
    display: inline-block;
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--accent);
    text-decoration: none;
    border: 1px solid var(--accent);
    padding: 16px 32px;
    transition: background 0.2s ease, color 0.2s ease;
  }

  .cta-link:hover {
    background: var(--accent);
    color: var(--black);
  }

  footer {
    border-top: 1px solid var(--border);
    padding: 24px 6vw;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .footer-logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 18px;
    letter-spacing: 3px;
    color: var(--accent);
  }

  .footer-copy { font-size: 12px; color: var(--muted); }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes shimmer {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .reveal {
    opacity: 0;
    transform: translateY(28px);
    transition: opacity 0.7s ease, transform 0.7s ease;
  }

  .reveal.visible { opacity: 1; transform: translateY(0); }

  @media (max-width: 768px) {
    .hero { grid-template-columns: 1fr; gap: 40px; }
    .hero-photo-wrap { max-width: 320px; margin: 0 auto; }
  }

  

  .hero-photos {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    opacity: 0;
    animation: fadeUp 0.9s ease 0.2s forwards;
  }
  .collab-avatar {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    object-fit: cover;
    object-position: top center;
    border: 3px solid rgba(245,158,11,0.5);
  }
  .collab-avatar-sandro {
    border-color: rgba(245,158,11,0.9);
  }
  .collab-x {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px;
    color: var(--accent);
    opacity: 0.6;
    line-height: 1;
  }
</style>
</head>

<script>
  const reveals = document.querySelectorAll('.reveal');
  const observer = new IntersectionObserver((entries) => {
    entries.forEach((entry, i) => {
      if (entry.isIntersecting) {
        setTimeout(() => entry.target.classList.add('visible'), i * 100);
        observer.unobserve(entry.target);
      }
    });
  }, { threshold: 0.1 });
  reveals.forEach(el => observer.observe(el));
</script>
